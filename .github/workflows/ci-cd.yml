name: Decision Engine CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  NAMESPACE: decision-engine-dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [loan-service, ai-service, identity-server, credit-bureau]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET (for .NET services)
      if: matrix.service != 'ai-service'
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Setup Python (for AI service)
      if: matrix.service == 'ai-service'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Run tests - .NET
      if: matrix.service != 'ai-service'
      run: |
        cd ${{ matrix.service }}
        dotnet test --logger trx --results-directory TestResults/
    
    - name: Run tests - Python
      if: matrix.service == 'ai-service'
      run: |
        cd ai-service
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest --cov=. --cov-report=xml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [loan-service, ai-service, identity-server, credit-bureau]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
    
    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v1
      with:
        namespace: ${{ env.NAMESPACE }}
        manifests: |
          k8s/${{ matrix.service }}-deployment.yaml
        images: |
          ${{ matrix.service }}=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  frontend-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: loan-frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd loan-frontend
        npm ci
    
    - name: Build frontend
      run: |
        cd loan-frontend
        npm run build
    
    - name: Deploy to staging
      run: |
        # Add deployment script here
        echo "Deploying frontend to staging environment"
