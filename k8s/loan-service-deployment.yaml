# ----------------------------
# 1) Secret con la cadena de conexión actualizada
# ----------------------------
apiVersion: v1
kind: Secret
metadata:
  name: loan-service-db-secret
  namespace: decision-engine-dev
type: Opaque
stringData:
  connectionString: "Server=mssql;Database=LoanDb;User Id=loan_app;Password=LoanApp@123;TrustServerCertificate=True;"

---
# ----------------------------
# 2) Deployment del LoanService
# ----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: decision-engine-dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      restartPolicy: Always
      containers:
      - name: loan-service
        image: loan-service:1.0
        ports:
          - containerPort: 80
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Development"
          - name: ASPNETCORE_URLS
            value: "http://+:80"
          - name: ConnectionStrings__LoanDb
            valueFrom:
              secretKeyRef:
                name: loan-service-db-secret
                key: connectionString
          - name: IdentityServer__Authority
            value: "http://identity-server.decision-engine-dev.svc.cluster.local:5001"
          - name: RabbitMq__Uri
            valueFrom:
              configMapKeyRef:
                name: rabbitmq-config
                key: RabbitMq__Uri
        # ✅ Basic health checks using minimal API endpoint
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        # ✅ Resource limits for stability
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# ----------------------------
# 3) Service interno ClusterIP
# ----------------------------
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: decision-engine-dev
spec:
  selector:
    app: loan-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ----------------------------
# 4) Ingress (LoanService.local)
# ----------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-service-ingress
  namespace: decision-engine-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: loan-service.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loan-service
                port:
                  number: 80
