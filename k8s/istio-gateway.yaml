apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: decision-engine-gateway
  namespace: decision-engine-dev
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - decision-engine.local
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: decision-engine-tls
    hosts:
    - decision-engine.local
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: decision-engine-vs
  namespace: decision-engine-dev
spec:
  hosts:
  - decision-engine.local
  gateways:
  - decision-engine-gateway
  http:
  - match:
    - uri:
        prefix: /api/loans
    route:
    - destination:
        host: loan-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/ai
    route:
    - destination:
        host: ai-inference
        port:
          number: 8000
    timeout: 30s
  - match:
    - uri:
        prefix: /api/auth
    route:
    - destination:
        host: identityserver
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/credit
    route:
    - destination:
        host: credit-bureau
        port:
          number: 80
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: frontend
        port:
          number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: loan-service-dr
  namespace: decision-engine-dev
spec:
  host: loan-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    circuitBreaker:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
