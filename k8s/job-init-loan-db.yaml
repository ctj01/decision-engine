---
# 1) secret for Loan App credentials
apiVersion: v1
kind: Secret
metadata:
  name: loan-app-secret
  namespace: decision-engine-dev
type: Opaque
stringData:
  DB_USER: "loan_app"
  DB_PASS: "LoanApp@123"

---
# 2) Secret for LoanDb SA password
apiVersion: v1
kind: Secret
metadata:
  name: loandb-sa-secret
  namespace: decision-engine-dev
type: Opaque
stringData:
  SA_PASSWORD: "YourStrong@Passw0rd"

---
# 3) Job to initialize LoanDb
apiVersion: batch/v1
kind: Job
metadata:
  name: init-loan-db
  namespace: decision-engine-dev
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-loan-db
        image: mcr.microsoft.com/mssql-tools
        command: ["/bin/bash", "-c", "--"]
        args:
        - |
          # Espera para que SQL Server arranque
          sleep 20

          # 1) Crear base si no existe
          /opt/mssql-tools/bin/sqlcmd -S mssql-0.mssql -U SA -P "$SA_PASSWORD" -Q "
            IF DB_ID('LoanDb') IS NULL
            BEGIN
              CREATE DATABASE [LoanDb];
            END
          "

          # 2) Crear login/usuario y dar permisos si no existen
          /opt/mssql-tools/bin/sqlcmd -S mssql-0.mssql -U SA -P "$SA_PASSWORD" -d LoanDb -Q "
            IF NOT EXISTS (SELECT name FROM sys.sql_logins WHERE name = N'$(DB_USER)')
            BEGIN
              CREATE LOGIN [$(DB_USER)] WITH PASSWORD=N'$(DB_PASS)';
            END
            IF NOT EXISTS (SELECT name FROM sys.database_principals WHERE name = N'$(DB_USER)')
            BEGIN
              CREATE USER [$(DB_USER)] FOR LOGIN [$(DB_USER)];
              ALTER ROLE db_owner ADD MEMBER [$(DB_USER)];
            END
          "

          echo "✅ LoanDb is ready on existing SQL Server."
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: loandb-sa-secret
              key: SA_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: loan-app-secret
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: loan-app-secret
              key: DB_PASS
