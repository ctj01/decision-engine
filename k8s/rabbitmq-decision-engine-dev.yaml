# 1) RabbitMQ Deployment y Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: decision-engine-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:management
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          value: "admin"
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672

---
# 2) RabbitMQ Service AMQP y Management
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: decision-engine-dev
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
    nodePort: 30928
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 31894

---
# 3) Dead-letter queue for failed messages
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: user-registered-queue
  namespace: decision-engine-dev
spec:
  name: user-registered-queue
  arguments:
    # Exchange por defecto (“”) y ruta a la DLQ
    x-dead-letter-exchange: ""
    x-dead-letter-routing-key: user-registered-queue-dlq

---
# 4) Dead-letter queue  for failed messages
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: user-registered-queue-dlq
  namespace: decision-engine-dev
spec:
  name: user-registered-queue-dlq
