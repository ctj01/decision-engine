apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: decision-engine-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "loan_engine_rules.yml"
    
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - decision-engine-dev
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      - job_name: 'loan-service'
        static_configs:
          - targets: ['loan-service:80']
        metrics_path: /metrics
        scrape_interval: 10s
      
      - job_name: 'ai-service'
        static_configs:
          - targets: ['ai-inference:8000']
        metrics_path: /metrics
        scrape_interval: 10s
      
      - job_name: 'identity-server'
        static_configs:
          - targets: ['identityserver:80']
        metrics_path: /metrics
        scrape_interval: 10s

  loan_engine_rules.yml: |
    groups:
      - name: decision_engine_alerts
        rules:
          - alert: HighLoanRejectionRate
            expr: rate(loan_decisions_total{decision="reject"}[5m]) / rate(loan_decisions_total[5m]) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High loan rejection rate detected"
              description: "Loan rejection rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          
          - alert: AIServiceDown
            expr: up{job="ai-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "AI Service is down"
              description: "AI inference service has been down for more than 1 minute"
          
          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_request_latency_seconds_bucket[5m])) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time detected"
              description: "95th percentile response time is {{ $value }}s"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: decision-engine-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=15d'
          - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-storage
          mountPath: /prometheus/
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: decision-engine-dev
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: LoadBalancer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: decision-engine-dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: decision-engine-dev
